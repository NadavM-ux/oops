<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="fonts/logo.css">
<style>html,body{margin:0;background:transparent}svg{display:block}</style>
<div id="root"></div>
<script>
// ?os=mac|win&v=normal|paused|alert|ok
const q = new URLSearchParams(location.search);
const os = q.get("os") || "mac", v = q.get("v") || "normal";
const glyph = (fill) => v === "ok"
  ? `<path d="M5.6 9.2 L8 11.6 L12.6 6.6" fill="none" stroke="${fill}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`
  : v === "alert"
  ? `<rect x="8.05" y="4.6" width="1.9" height="5.2" rx=".95" fill="${fill}"/><circle cx="9" cy="11.6" r="1.1" fill="${fill}"/>`
  : `<text x="9" y="12.35" text-anchor="middle" font-family="Oops Logo" font-weight="800" font-size="9.6" fill="${fill}">ש</text>`;
let svg;
if (os === "mac") {
  // Template image: only alpha matters. 18pt drawn at 2x.
  svg = `<svg width="36" height="36" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
    <defs><mask id="m"><rect width="18" height="18" fill="#fff"/><rect x="2.85" y="2.75" width="12.3" height="10.35" rx="2.3" fill="#000"/></mask></defs>
    <g opacity="${v === "paused" ? 0.42 : 1}">
      <rect x="1.2" y="1.4" width="15.6" height="15.2" rx="3.6" fill="#000" mask="url(#m)"/>
      ${glyph("#000")}
    </g></svg>`;
} else {
  const face = { normal: "#FFFFFF", paused: "#D7DAD4", alert: "#FFC53D", ok: "#1E9E6A" }[v];
  const ink = { normal: "#E2412E", paused: "#7D828A", alert: "#2B2F37", ok: "#FFFFFF" }[v];
  svg = `<svg width="32" height="32" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1.2" width="16" height="15.8" rx="3.8" fill="#2B2F37"/>
    <rect x="2.5" y="2.4" width="13" height="11.1" rx="2.6" fill="${face}"/>
    <g transform="translate(0 -0.15)">${glyph(ink)}</g></svg>`;
}
document.getElementById("root").innerHTML = svg;
</script>

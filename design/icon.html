<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="fonts/logo.css">
<style>html,body{margin:0;background:transparent}svg{display:block}</style>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B414C"/><stop offset="1" stop-color="#1B1E24"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0EB"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E7E4"/><stop offset="1" stop-color="#ACB0AA"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <g filter="url(#drop)">
    <rect x="226" y="222" width="572" height="598" rx="104" fill="url(#skirt)"/>
  </g>
  <rect x="268" y="240" width="488" height="482" rx="76" fill="url(#face)"/>
  <rect x="268" y="240" width="488" height="482" rx="76" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="322" y="410" font-family="IBM Plex Sans Hebrew" font-weight="600" font-size="160" fill="#15171C">A</text>
  <text x="712" y="676" text-anchor="end" font-family="Oops Logo" font-weight="800" font-size="300" fill="#E2412E">ש</text>
</svg>

<!doctype html><meta charset="utf-8">
<!-- Background of the macOS installer window (640x420 points; rendered at 1x and 2x).
     Finder draws the icons on top: Oops at (160, 200), Applications at (480, 200), icon size 112.
     Finder's labels are white in dark mode and black in light mode, so each label gets a
     mid-gray plate that keeps both readable. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html, body { margin: 0; width: 640px; height: 420px; overflow: hidden; }
body {
  position: relative;
  font-family: 'IBM Plex Sans Hebrew', system-ui, sans-serif;
  color: #F4F5F2;
  background:
    radial-gradient(ellipse 360px 190px at 320px 214px, rgba(255,255,255,.075), transparent 70%),
    linear-gradient(#262A31, #16181D);
}
.title { position: absolute; top: 34px; width: 100%; text-align: center; direction: rtl; font-weight: 600; font-size: 21px; letter-spacing: -.01em; }
.sub { position: absolute; top: 68px; width: 100%; text-align: center; font-size: 13px; color: #9BA1A9; }
/* plates behind Finder's labels: luminance ~0.17, readable with white or black text */
.plate { position: absolute; top: 253px; width: 128px; height: 30px; margin-left: -64px; border-radius: 9px;
  background: linear-gradient(#787D85, #6A6F77); box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14); }
.tip { position: absolute; left: 70px; right: 70px; bottom: 26px; padding: 10px 16px 11px; border-radius: 12px;
  background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); text-align: center; }
.tip .he { direction: rtl; font-size: 12.5px; color: #C9CDD3; }
.tip .he b { color: #FFFFFF; font-weight: 600; }
.tip .en { margin-top: 3px; font-size: 11px; color: #858B93; }
svg { position: absolute; left: 0; top: 0; }
</style>
<div class="title">גררו את Oops לתיקיית Applications</div>
<div class="sub">Drag Oops into the Applications folder</div>
<svg width="640" height="420" viewBox="0 0 640 420" aria-hidden="true">
  <path d="M238 196 C 290 162, 350 162, 398 190" fill="none" stroke="#FF6A55" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 13"/>
  <path d="M396.9 179.4 L403.2 193 L388.2 194.2" fill="none" stroke="#FF6A55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="plate" style="left:160px"></div>
<div class="plate" style="left:480px"></div>
<div class="tip">
  <div class="he">פתיחה ראשונה נחסמה? <b>הגדרות המערכת ← פרטיות ואבטחה ← לפתוח בכל זאת</b></div>
  <div class="en">First launch blocked? System Settings → Privacy &amp; Security → Open Anyway</div>
</div>
